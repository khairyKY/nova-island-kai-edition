# Builds the installer on GitHub and publishes it with the files the auto-updater reads
# (Setup-x.y.z.exe, its .blockmap, latest.yml). Pushing a tag vX.Y.Z (matching package.json's
# version) releases it; "Run workflow" re-releases an existing tag. The 116 MB upload happens
# from GitHub's side, so a slow connection only has to push the code.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.7.19)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish
        run: npx electron-builder --win nsis --publish always -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
